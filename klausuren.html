<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222222">
    <title>Klausuren – Studium</title>

    <link rel="stylesheet" href="style.css?v=20261015-dynamic">
    <link rel="stylesheet" href="klausuren.css?v=20261015-dynamic">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=20261015-dynamic"></script>
</head>

<body class="klausuren-page">

    <!-- Einziger Navigationsbutton: zurück zur Hauptseite Studium -->
    <a href="index.html" class="zurueck-button">← Zurück</a>


    <h1>Klausuren</h1>


    <!-- ==============================
         TAGE / WOCHEN SCHALTER
         ============================== -->

    <div class="umschalter">

        <button id="tage-button" class="aktiv">
            Tage
        </button>

        <button id="wochen-button">
            Wochen
        </button>

    </div>


    <!-- ==============================
         KLAUSUREN
         ============================== -->

    <p id="klausuren-status" class="klausuren-status" role="status" aria-live="polite" hidden></p>

    <div class="klausuren-container">


        <!-- VERGANGENE KLAUSUREN -->

        <div class="bereich">

            <h2 class="bereich-titel">VERGANGENE KLAUSUREN</h2>
            <div id="vergangene-klausuren" class="klausuren-liste"></div>
            <p id="vergangene-leer" class="keine-klausuren">Keine vergangenen Klausuren.</p>

        </div>


        <!-- KOMMENDE KLAUSUREN -->

        <div class="bereich">

            <h2 class="bereich-titel">KOMMENDE KLAUSUREN</h2>
            <div id="kommende-klausuren" class="klausuren-liste"></div>
            <p id="kommende-leer" class="keine-klausuren">Keine kommenden Klausuren.</p>

        </div>

    </div>


    <script src="klausuren.js?v=20261015-dynamic"></script>

</body>

</html>
